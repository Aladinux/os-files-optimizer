[package]
name = "os-files-optimizer"
version = "0.1.0"
description = "Détecteur de fichiers en double multi-plateforme"
edition = "2021"
license = "MIT"

[lib]
name = "os_files_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
czkawka_core = "12.0.2"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
